package: example
fetch:
  - type: spec-update
    set-version: true
    reset-release: "1"
    substitutions:
      - pattern: "^%global forgeurl.*$"
        replacement: "%global forgeurl https://example.com/${PACKAGE}"
  - type: spec-source
    index: 0
  - type: url
    url: "https://example.com/${PACKAGE}-${VERSION}-extra.tar.gz"
    filename: "extra.tar.gz"
  - type: git
    repo: "https://example.com/example.git"
    ref: "v${VERSION}"
    shallow: true
  - type: vendor
    ecosystem: go
    modules:
      - path: "."
transform:
  - type: strip-tarball
    paths: ["docs/"]
toolchain:
  - name: go
    version: "1.22"
verify:
  - type: gpg
    keyring: example.gpg
policy:
  vendor-constraints:
    go:
      minimum: "1.20"
patches:
  - file: 0001-fix.patch
    classification: cve-fix
post:
  - type: extract-vendor-versions
    ecosystem: go
