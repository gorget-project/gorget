name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/hi/python:3.11-builder
      options: --user root
    steps:
      - name: Install system dependencies
        run: dnf install -y git rpm-build

      - uses: actions/checkout@v4

      - name: Install gorget with dev dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check src/ tests/

      - name: mypy
        run: mypy src/gorget

      - name: pytest
        run: pytest -v
