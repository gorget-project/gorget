package: example
fetch:
  - type: spec-update
    set-version: true
    reset-release: "1"
    substitutions:
      - pattern: "^%global forgeurl.*$"
        replacement: "%global forgeurl https://example.com/${PACKAGE}"
  - type: spec-source
    index: 0
  - type: url
    url: "https://example.com/${PACKAGE}-${VERSION}-extra.tar.gz"
    filename: "extra.tar.gz"
  - type: git
    repo: "https://example.com/example.git"
    ref: "v${VERSION}"
    shallow: true
  - type: vendor
    ecosystem: go
    modules:
      - path: "."
transform:
  - type: strip-tarball
    paths: ["docs/"]
toolchain:
  - name: go
    version: "1.22"
verify:
  - type: gpg-signature
    target: "example-1.2.3.tar.gz"
    signature: "example-1.2.3.tar.gz.asc"
    keyring: example.gpg
policy:
  vendor-constraints:
    - package: golang.org/x/crypto
      ecosystem: go
      version: "0.31.0"
      reason: "CVE-2024-45337"
  audit: true
  license-compliance:
    disallowed:
      - GPL-3.0-only
patches:
  - file: 0001-fix.patch
    classification: cve-fix
post:
  - type: run
    command: ["./generate-bundled-provides.py", "${VERSION}"]
accepted-checksums:
  - file: "example-1.2.2.tar.gz"
    checksum: "deadbeef"
    reason: "Upstream republished with a corrected LICENSE file, verified by hand 2024-01-01"
