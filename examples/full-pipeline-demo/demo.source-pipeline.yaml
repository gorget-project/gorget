fetch:
  - type: git
    repo: "./demo-repo"
    ref: "main"
    archive_name: "demo-main.tar.gz"

  # A second, independent fetch lane exercising `verify:` -- git-cloned/tarred
  # content isn't byte-stable run-to-run (timestamps), so gpg-signature and
  # re-publication checks below target this real, immutable upstream release
  # instead (same artifact as ../verify-demo).
  - type: url
    url: "https://ftp.gnu.org/gnu/hello/hello-2.12.1.tar.gz"
  - type: url
    url: "https://ftp.gnu.org/gnu/hello/hello-2.12.1.tar.gz.sig"
    filename: "hello-2.12.1.tar.gz.sig"

transform:
  # Remove docs/ from the source before later transforms use and emit it.
  # `target` is required here (unlike go-pipeline-demo) since multiple artifacts
  # are fetched, so gorget cannot select one by itself.
  - type: strip-tarball
    target: "demo-main.tar.gz"
    paths:
      - "*/docs"

  - type: vendor-bump
    ecosystem: go
    pins:
      # Plain version means ">=" (minimum). Tilde prefix (e.g. "~1.5")
      # pins to that prefix (latest 1.5.x). Go module versions need the
      # "v" prefix -- unlike npm/cargo, which don't use one.
      - dependency: "rsc.io/quote"
        version: "v1.5.2"

  # Re-vendor now that vendor-bump has bumped the dependency.
  - type: vendor
    ecosystem: go

  - type: build-ui
    ecosystem: npm
    script: build
    path: ui
    output-dir: dist

  # Escape hatch: an arbitrary command, with declared outputs archived as new
  # artifacts afterward. Both Node invocations resolve to node-24 through the
  # pipeline-scoped toolchain PATH, including the child launched through env.
  - type: run
    command: ["sh", "-c", "go version > go-version.txt && node --version > node-version.txt && /usr/bin/env node --version > env-node-version.txt"]
    outputs:
      - go-version.txt
      - node-version.txt
      - env-node-version.txt

  # Packs a file already sitting in --package-dir (this directory) verbatim
  # -- unlike everything above, which operates against demo-repo/'s fetched
  # checkout. Built with Python's own tarfile/gzip rather than the system
  # tar/gzip binaries, so it's byte-identical regardless of which
  # environment runs it.
  - type: pack
    files: ["setup-demo-repo.sh"]
    output: "demo-packaging-scripts.tar.gz"

# Select the parallel-installed Node.js 24 RPM commands (node-24, npm-24,
# npx-24) for every stage without changing the system-wide alternatives.
# The quotes are required because toolchain versions are strings.
toolchain:
  - name: node
    version: "24"
    minimum-version: "24.16"

# Real GPG signature check against GNU Hello's actual upstream maintainer key
# (see ../verify-demo/README.md for where gpg-keys/hello-maintainer.asc came
# from). Re-publication detection also runs automatically since `sources`
# exists in this directory -- no separate step needed for it.
verify:
  - type: gpg-signature
    target: "hello-2.12.1.tar.gz"
    signature: "hello-2.12.1.tar.gz.sig"
    keyring: "hello-maintainer.asc"

# Safety net confirming vendor-bump's bump actually took effect in the
# vendored archive -- re-checked on every run, so a later change reverting
# the pin fails closed instead of shipping quietly (see ../policy-demo).
policy:
  vendor-constraints:
    - package: rsc.io/quote
      ecosystem: go
      version: "1.5.2"
      reason: "demo: confirms the vendor-bump above actually took effect"

publish:
  files:
    - "demo-main.tar.gz"
    - "hello-2.12.1.tar.gz"
    - "hello-2.12.1.tar.gz.sig"
    - "${PACKAGE}-vendor.tar.gz"
    - "${PACKAGE}-ui-assets.tar.gz"
    - "go-version.txt"
    - "node-version.txt"
    - "env-node-version.txt"
    - "demo-packaging-scripts.tar.gz"
